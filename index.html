<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Galaxtris (ギャラクトリス)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #06090e;
      color: #e6edf3;
      font-family: 'DotGothic16', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 255, 180, 0.2), 0 0 80px rgba(255, 0, 100, 0.15);
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #202b38;
      background: #020408;
      width: min(540px, calc(100vw - 12px), calc((100dvh - 44px) * 540 / 720));
      aspect-ratio: 540 / 720;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }
    /* ブラウン管 (CRT) エフェクトレイヤー */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* 走査線（スキャンライン） */
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
    }
    /* CRT曲面ガラス反射＆ビネット（四隅の湾曲減光） */
    .crt-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0, 255, 200, 0.1);
      z-index: 11;
    }

    #instructions {
      margin-top: 6px;
      font-size: 11px;
      color: #8b949e;
      text-align: center;
      line-height: 1.4;
      padding: 0 8px;
      pointer-events: none;
    }
    @media (max-height: 700px) {
      #instructions {
        font-size: 10px;
        margin-top: 3px;
      }
    }
    kbd {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 1px 5px;
      border-radius: 4px;
      color: #00ffcc;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="540" height="720"></canvas>
    <div class="crt-overlay"></div>
    <div class="crt-vignette"></div>
  </div>
  <div id="instructions">
    Galaxtris ｜ <span style="color:#00ffcc">スマホ: 押し続け＋ドラッグで移動＆連射</span><br/>
    PC: <kbd>WASD</kbd>/マウス移動 ｜ <kbd>Space</kbd>/クリック連射 ｜ <kbd>Esc</kbd>: ポーズ ｜ <kbd>M</kbd>: 音声
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
