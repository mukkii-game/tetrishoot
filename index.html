<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テトリシュー - TETRISHOOT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.25), 0 0 10px rgba(255, 0, 128, 0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #30363d;
      background: #05070a;
    }
    canvas {
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
    }
    .hud-stage {
      color: #58a6ff;
      font-size: 16px;
      letter-spacing: 2px;
    }
    .hud-phase {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }
    .phase-tetris {
      background: rgba(0, 230, 150, 0.25);
      border: 1px solid #00e696;
      color: #00ffaa;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
    }
    .phase-shooting {
      background: rgba(255, 50, 100, 0.25);
      border: 1px solid #ff3264;
      color: #ff507a;
      box-shadow: 0 0 10px rgba(255, 80, 122, 0.3);
    }
    .hud-score {
      color: #f0883e;
      font-size: 15px;
    }
    .timer-container {
      position: absolute;
      top: 42px;
      left: 15px;
      right: 15px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #instructions {
      margin-top: 12px;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
      line-height: 1.6;
    }
    kbd {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #c9d1d9;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="540" height="720"></canvas>
    <div id="ui-layer">
      <div class="hud">
        <div class="hud-stage" id="hud-stage">STAGE 1 / 10</div>
        <div class="hud-phase phase-tetris" id="hud-phase">TETRIS TIME</div>
        <div class="hud-score" id="hud-score">SCORE: 0</div>
      </div>
      <div class="timer-container">
        <div class="timer-bar" id="timer-bar" style="background: #00ffaa;"></div>
      </div>
    </div>
  </div>
  <div id="instructions">
    テトリスタイム: <kbd>←</kbd><kbd>→</kbd> または <kbd>A</kbd><kbd>D</kbd> で移動 ｜ <kbd>↑</kbd> または <kbd>Space</kbd> で回転 ｜ <kbd>↓</kbd> で高速落下 ｜ 接触した瞬間に確定！<br/>
    シューティング: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> または <kbd>WASD</kbd> / マウスで上下左右移動 ｜ <kbd>Space</kbd> / クリック: ショット(自動連射有) ｜ <kbd>M</kbd>: ミュート
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
