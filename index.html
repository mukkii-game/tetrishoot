<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テトリシュー - TETRISHOOT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #06090e;
      color: #e6edf3;
      font-family: 'Courier New', 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 255, 180, 0.2), 0 0 80px rgba(255, 0, 100, 0.15);
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #202b38;
      background: #020408;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    /* ブラウン管 (CRT) エフェクトレイヤー */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* 走査線（スキャンライン） */
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
    }
    /* CRT曲面ガラス反射＆ビネット（四隅の湾曲減光） */
    .crt-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0, 255, 200, 0.1);
      z-index: 11;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 12;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0, 255, 200, 0.6);
    }
    .hud-stage {
      color: #00f0ff;
      font-size: 15px;
    }
    .hud-phase {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 900;
    }
    .phase-tetris {
      background: rgba(0, 255, 150, 0.2);
      border: 1px solid #00ffaa;
      color: #00ffaa;
    }
    .phase-shooting {
      background: rgba(255, 40, 80, 0.2);
      border: 1px solid #ff2255;
      color: #ff3366;
    }
    .hud-score {
      color: #ffea00;
      font-size: 14px;
    }
    .tetris-stock-container {
      position: absolute;
      top: 40px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8be9fd;
    }
    .stock-icons {
      display: flex;
      gap: 6px;
    }
    .stock-block {
      width: 12px;
      height: 12px;
      background: #00ffaa;
      border: 1px solid #ffffff;
      box-shadow: 0 0 6px #00ffaa;
      transition: opacity 0.2s;
    }
    .stock-block.spent {
      opacity: 0.2;
      background: #444;
      border-color: #666;
      box-shadow: none;
    }
    #instructions {
      margin-top: 10px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
      line-height: 1.6;
    }
    kbd {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #00ffcc;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="540" height="720"></canvas>
    <div class="crt-overlay"></div>
    <div class="crt-vignette"></div>
    <div id="ui-layer">
      <div class="hud">
        <div class="hud-stage" id="hud-stage">STAGE 1 / 10</div>
        <div class="hud-phase phase-tetris" id="hud-phase">PUZZLE TIME</div>
        <div class="hud-score" id="hud-score">SCORE: 0</div>
      </div>
      <div class="tetris-stock-container" id="stock-container">
        <span id="stock-label">BLOCKS: [1][2][3] OR TAB TO SWITCH</span>
        <div class="stock-icons" id="stock-icons">
          <div class="stock-block" id="stock-1"></div>
          <div class="stock-block" id="stock-2"></div>
          <div class="stock-block" id="stock-3"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="instructions">
    パズルタイムとシューティングタイムが交互にやってくる！<br/>
    操作: <kbd>WASD</kbd> / <kbd>↑↓←→</kbd> / マウス移動 ｜ <kbd>Space</kbd> / クリック: 回転・ショット ｜ <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>/<kbd>Tab</kbd>: ブロック切替 ｜ <kbd>M</kbd>: 音声切替
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
