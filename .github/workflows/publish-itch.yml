name: Publish to itch.io

# main に push すると Pages と同時に itch.io の html5 チャンネルへ push する。
# 手動実行(workflow_dispatch)も可。API キーは repo secret BUTLER_API_KEY。

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'itch'
  cancel-in-progress: false

env:
  ITCH_TARGET: mukkii/galaxtris
  ITCH_CHANNEL: html5

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Install butler
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -o butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::error::BUTLER_API_KEY secret is not set."
            exit 1
          fi
          ./butler-bin/butler push dist "${ITCH_TARGET}:${ITCH_CHANNEL}" \
            --userversion "${GITHUB_SHA::7}"
