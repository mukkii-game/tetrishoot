name: Deploy to GitHub Pages

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ★ お試し版：trial ブランチ（ステージBGM mp3 入り）を /trial/ 配下に同居させて Pages に載せる
      #   itch.io には main のビルドしか送らないので、お試し版は Pages だけで遊べる
      - name: Checkout trial branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: trial
          path: trial-src

      - name: Build trial variant
        if: hashFiles('trial-src/package.json') != ''
        run: |
          cd trial-src
          npm ci
          npm run build
          mkdir -p ../dist/trial
          cp -r dist/. ../dist/trial/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
